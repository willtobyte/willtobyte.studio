<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WillToByte</title>
    <style>
      :root {
        color-scheme: dark;
        font: 100% sans-serif;
      }

      body {
        display: grid;
        min-block-size: 100svh;
        margin: 0;
        place-items: center;
        background: #392945;
      }

      main {
        inline-size: min(calc(100% - 2rem), 32rem);
        text-align: center;
      }

      img {
        display: block;
        inline-size: 100%;
        block-size: auto;
      }

      a {
        display: block;
        margin-block-start: 1rem;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="Will to byte">
      <a href="mailto:contact@willtobyte.studio">contact@willtobyte.studio</a>
    </main>
  </body>
</html>
